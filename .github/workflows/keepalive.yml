name: Keep Supabase awake
# The free Supabase plan pauses a project after 7 days without activity.
# This reads one public row every 3 days so the Monrovia portal stays up.
on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the portal database
        run: |
          CFG=$(curl -fsSL https://redlinepermit.com/monrovia/config.js)
          URL=$(echo "$CFG" | sed -n 's/.*url: *"\([^"]*\)".*/\1/p')
          KEY=$(echo "$CFG" | sed -n 's/.*anonKey: *"\([^"]*\)".*/\1/p')
          curl -fsS "$URL/rest/v1/city_domains?select=city&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo
          echo "Pinged $URL"
