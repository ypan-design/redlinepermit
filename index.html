<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redline Permit</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="description" content="Redline Permit gives building departments an AI first read of each plan set. Reviewers decide every comment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rl-red:#b3201c;      /* Redline field */
    --rl-teal:#4fc3b4;     /* second colour */
    --rl-white:#ffffff;
    --rl-soft:rgba(255,255,255,.72);
  }
  html,body{margin:0;height:100%;background:var(--rl-red);overflow:hidden;color:var(--rl-white);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh}
  a{color:inherit;text-decoration:none}
  .rl-city{position:fixed;top:24px;left:28px;font-size:15px;font-weight:500;letter-spacing:.01em;
    padding:6px 0;border-bottom:1px solid rgba(255,255,255,.55);transition:border-color .2s}
  .rl-city:hover,.rl-city:focus-visible{border-color:#fff}
  .rl-copy{position:fixed;left:28px;bottom:28px;max-width:380px;pointer-events:none}
  .rl-copy h1{margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .rl-copy p{margin:0;font-size:14px;line-height:1.55;color:var(--rl-soft)}
  .rl-foot{position:fixed;right:28px;bottom:28px;font-size:12px;color:var(--rl-soft);display:flex;gap:16px}
  .rl-foot a:hover{color:#fff}
  @media (max-width:640px){
    .rl-city{top:16px;left:16px}
    .rl-copy{left:16px;right:16px;bottom:52px;max-width:none}
    .rl-foot{left:16px;right:auto;bottom:18px}
  }
</style>
</head>
<body>
<canvas id="rl-koi" aria-hidden="true"></canvas>
<a class="rl-city" href="/monrovia/">/Monrovia</a>
<div class="rl-copy">
  <h1>Redline Permit</h1>
  <p>An AI first read for city plan check. Every correction is circled on the sheet it belongs to, and a reviewer decides each one.</p>
</div>
<nav class="rl-foot"><a href="mailto:ypan@redlinepermit.com?subject=Redline%20Permit%20pilot">Start a pilot</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav>
<script>
/* Redline Permit landing: a koi swims across the red pond; its wake reveals a plan sheet. */
(() => {
  const RED = '#b3201c', TEAL = '#4fc3b4', PATCH = '#d93a2e', EYE = '#3a0e0b';
  const cv = document.getElementById('rl-koi'), ctx = cv.getContext('2d');
  const N = 16, CYCLE = 18, FADE = 1.6;
  let W, H, DPR, L, seg, bx, by, bw, bh, plan, rev, rctx;
  let pts = [], ang = 0, target = null, grid, wake = [], sparkles = [];
  let cycleStart = 0, last = 0, external = null;

  function mk() {
    const c = document.createElement('canvas');
    c.width = W * DPR; c.height = H * DPR;
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return c;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const m = Math.min(W, H);
    L = Math.max(80, Math.min(m * 0.3, 230)); seg = L / N;
    const ar = 1.45;
    bw = Math.min(W * (W < 640 ? 0.74 : 0.56), H * 0.5 * ar); bh = bw / ar;
    bx = (W - bw) / 2; by = Math.max(H * 0.14, H * (W < 640 ? 0.36 : 0.42) - bh / 2);
    plan = mk(); drawPlan(plan.getContext('2d'));
    rev = mk(); rctx = rev.getContext('2d');
    resetCycle(performance.now() / 1000, true);
    sparkles = Array.from({length: 16}, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.85,
      s: 2 + Math.random() * 4, p: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.2,
      c: Math.random() < 0.3 ? TEAL : '#fff'
    }));
  }

  function resetCycle(now, newFish) {
    cycleStart = now;
    rctx.setTransform(1, 0, 0, 1, 0, 0); rctx.clearRect(0, 0, rev.width, rev.height);
    rctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    grid = Array.from({length: 6}, () => new Array(8).fill(0));
    if (newFish || !pts.length) {
      const y = by + bh * (0.25 + Math.random() * 0.5);
      ang = 0;
      pts = Array.from({length: N + 1}, (_, i) => ({x: -L * 0.2 - i * seg, y}));
    }
    target = null; wake = [];
  }

  /* ---------- the hidden plan sheet ---------- */
  function drawPlan(g) {
    const X = x => bx + x * bw, Y = y => by + y * bh;
    const t = Math.max(3, bw * 0.011), thin = Math.max(1, bw * 0.0022);
    const fs = Math.max(7, bw * 0.02);
    g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineJoin = 'miter';

    const line = (x1, y1, x2, y2, w) => { g.lineWidth = w; g.beginPath(); g.moveTo(X(x1), Y(y1)); g.lineTo(X(x2), Y(y2)); g.stroke(); };
    const rect = (x1, y1, x2, y2, w = thin) => { g.lineWidth = w; g.strokeRect(X(x1), Y(y1), X(x2) - X(x1), Y(y2) - Y(y1)); };

    // walls (solid poché)
    g.lineCap = 'square';
    g.lineWidth = t * 1.4; g.strokeRect(X(0), Y(0), bw, bh);
    [[0.42, 0, 0.42, 1], [0, 0.55, 0.42, 0.55], [0.42, 0.4, 1, 0.4], [0.72, 0.4, 0.72, 1]].forEach(a => line(...a, t));
    g.lineCap = 'butt';

    // openings: cut, then draw
    const cut = (x1, y1, x2, y2, th) => {
      g.globalCompositeOperation = 'destination-out';
      if (y1 === y2) g.fillRect(X(x1), Y(y1) - th, X(x2) - X(x1), th * 2);
      else g.fillRect(X(x1) - th, Y(y1), th * 2, Y(y2) - Y(y1));
      g.globalCompositeOperation = 'source-over';
    };
    const door = (x1, y1, x2, y2, dir) => {
      cut(x1, y1, x2, y2, t * 0.9); g.lineWidth = thin; g.beginPath();
      if (y1 === y2) {
        const hx = X(x1), hy = Y(y1), len = X(x2) - X(x1);
        g.moveTo(hx, hy); g.lineTo(hx, hy + dir * len); g.stroke();
        g.beginPath(); g.setLineDash([3, 3]);
        g.arc(hx, hy, len, dir > 0 ? Math.PI / 2 : -Math.PI / 2, 0, dir < 0); g.stroke();
      } else {
        const hx = X(x1), hy = Y(y1), len = Y(y2) - Y(y1);
        g.moveTo(hx, hy); g.lineTo(hx + dir * len, hy); g.stroke();
        g.beginPath(); g.setLineDash([3, 3]);
        g.arc(hx, hy, len, dir > 0 ? 0 : Math.PI, Math.PI / 2, dir < 0); g.stroke();
      }
      g.setLineDash([]);
    };
    const win = (x1, y1, x2, y2) => {
      const th = t * 1.1; cut(x1, y1, x2, y2, th); g.lineWidth = thin;
      if (y1 === y2) [-th * 0.7, 0, th * 0.7].forEach(o => { g.beginPath(); g.moveTo(X(x1), Y(y1) + o); g.lineTo(X(x2), Y(y1) + o); g.stroke(); });
      else [-th * 0.7, 0, th * 0.7].forEach(o => { g.beginPath(); g.moveTo(X(x1) + o, Y(y1)); g.lineTo(X(x1) + o, Y(y2)); g.stroke(); });
    };
    door(0.12, 0, 0.22, 0, 1);            // entry
    door(0.42, 0.14, 0.42, 0.26, -1);      // living / kitchen
    door(0.26, 0.55, 0.36, 0.55, 1);       // living / bed 1
    door(0.42, 0.62, 0.42, 0.72, 1);       // bed 1 / bath
    door(0.78, 0.4, 0.88, 0.4, 1);         // kitchen / bed 2
    win(0.55, 0, 0.78, 0); win(0, 0.18, 0, 0.38); win(0, 0.68, 0, 0.86);
    win(0.8, 1, 0.94, 1); win(1, 0.55, 1, 0.78); win(0.27, 1, 0.37, 1);

    // fixtures
    rect(0.45, 0.03, 0.7, 0.1); rect(0.91, 0.03, 0.97, 0.32);          // counters
    rect(0.56, 0.19, 0.8, 0.27);                                         // island
    rect(0.6, 0.045, 0.66, 0.085);
    g.beginPath(); g.arc(X(0.63), Y(0.065), bw * 0.008, 0, 7); g.stroke(); // sink
    rect(0.45, 0.8, 0.69, 0.96); rect(0.465, 0.825, 0.675, 0.935);       // tub
    rect(0.6, 0.44, 0.69, 0.53);
    g.beginPath(); g.ellipse(X(0.645), Y(0.485), bw * 0.018, bh * 0.025, 0, 0, 7); g.stroke();
    rect(0.46, 0.44, 0.52, 0.47);
    g.beginPath(); g.ellipse(X(0.49), Y(0.52), bw * 0.016, bh * 0.04, 0, 0, 7); g.stroke(); // wc
    rect(0.07, 0.66, 0.3, 0.93); rect(0.09, 0.675, 0.17, 0.72); rect(0.2, 0.675, 0.28, 0.72); // bed 1
    rect(0.77, 0.58, 0.96, 0.84); rect(0.79, 0.595, 0.855, 0.635); rect(0.875, 0.595, 0.94, 0.635); // bed 2
    rect(0.05, 0.06, 0.08, 0.36); rect(0.05, 0.06, 0.25, 0.1);           // sofa
    rect(0.13, 0.17, 0.25, 0.27);                                        // table

    // room labels
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const label = (s, a, x, y) => {
      g.font = `600 ${fs}px system-ui,sans-serif`; g.fillText(s, X(x), Y(y));
      g.font = `400 ${fs * 0.8}px system-ui,sans-serif`; g.fillText(a, X(x), Y(y) + fs * 1.15);
    };
    label('LIVING', '210 SF', 0.25, 0.43); label('KITCHEN', '180 SF', 0.7, 0.33);
    label('BED 1', '150 SF', 0.19, 0.97 - 0.02 - 0.0); label('BATH', '72 SF', 0.57, 0.66);
    label('BED 2', '120 SF', 0.86, 0.91);

    // dimension string
    g.lineWidth = thin; const dy = -0.07, tick = bw * 0.008;
    line(0, dy, 1, dy, thin);
    [[0], [0.42], [0.72], [1]].forEach(([x]) => { g.beginPath(); g.moveTo(X(x) - tick, Y(dy) + tick); g.lineTo(X(x) + tick, Y(dy) - tick); g.stroke(); });
    g.font = `400 ${fs * 0.85}px system-ui,sans-serif`; g.textBaseline = 'bottom';
    [[0.21, "14'-6\""], [0.57, "10'-4\""], [0.86, "9'-8\""]].forEach(([x, s]) => g.fillText(s, X(x), Y(dy) - 3));
    const dx = -0.05; line(dx, 0, dx, 1, thin);
    [0, 0.55, 1].forEach(y => { g.beginPath(); g.moveTo(X(dx) - tick, Y(y) + tick); g.lineTo(X(dx) + tick, Y(y) - tick); g.stroke(); });

    // grid bubbles
    const r = Math.max(6, bw * 0.02);
    g.textBaseline = 'middle'; g.font = `600 ${fs * 0.85}px system-ui,sans-serif`;
    g.setLineDash([4, 4]);
    [0, 0.42, 0.72, 1].forEach(x => line(x, -0.13 + r / bh, x, -0.01, thin));
    g.setLineDash([]);
    [0, 0.42, 0.72, 1].forEach((x, i) => { g.beginPath(); g.arc(X(x), Y(-0.13), r, 0, 7); g.stroke(); g.fillText(String(i + 1), X(x), Y(-0.13)); });

    // north arrow
    const nx = X(1) + bw * 0.06, ny = Y(0.12);
    g.beginPath(); g.arc(nx, ny, r * 1.2, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(nx, ny - r * 1.2); g.lineTo(nx + r * 0.5, ny + r * 0.6); g.lineTo(nx, ny + r * 0.2); g.closePath(); g.fill();
    g.fillText('N', nx, ny - r * 2);

    // sheet title
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.beginPath(); g.arc(X(0) + r, Y(1.09), r, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(X(0), Y(1.09)); g.lineTo(X(0) + 2 * r, Y(1.09)); g.stroke();
    g.font = `600 ${fs * 0.7}px system-ui,sans-serif`; g.fillText('1', X(0) + r * 0.75, Y(1.09) - r * 0.45);
    g.fillText('A1.1', X(0) + r * 0.45, Y(1.09) + r * 0.5);
    g.font = `600 ${fs}px system-ui,sans-serif`; g.fillText('FLOOR PLAN', X(0) + r * 2.8, Y(1.09) - fs * 0.35);
    g.font = `400 ${fs * 0.8}px system-ui,sans-serif`; g.fillText('1/4" = 1\'-0"', X(0) + r * 2.8, Y(1.09) + fs * 0.65);

    // the redline: a teal revision cloud around the bath with its delta
    g.strokeStyle = TEAL; g.fillStyle = TEAL; g.lineWidth = Math.max(1.2, thin * 1.3);
    const c = [X(0.44), Y(0.415), X(0.705), Y(0.985)], bump = Math.max(5, bw * 0.016);
    g.beginPath(); g.moveTo(c[0], c[1]);
    const edge = (x1, y1, x2, y2, nx, ny) => {
      const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.round(len / (bump * 2)));
      for (let i = 0; i < n; i++) {
        const ax = x1 + (x2 - x1) * (i + 1) / n, ay = y1 + (y2 - y1) * (i + 1) / n;
        const mx = x1 + (x2 - x1) * (i + 0.5) / n, my = y1 + (y2 - y1) * (i + 0.5) / n;
        g.quadraticCurveTo(mx + nx * bump * 1.6, my + ny * bump * 1.6, ax, ay);
      }
    };
    edge(c[0], c[1], c[2], c[1], 0, -1); edge(c[2], c[1], c[2], c[3], 1, 0);
    edge(c[2], c[3], c[0], c[3], 0, 1); edge(c[0], c[3], c[0], c[1], -1, 0);
    g.stroke();
    const tx = c[2] + bump * 2.2, ty = c[1] - bump * 1.2, ts = Math.max(9, bw * 0.03);
    g.beginPath(); g.moveTo(tx, ty - ts * 0.6); g.lineTo(tx + ts * 0.6, ty + ts * 0.45); g.lineTo(tx - ts * 0.6, ty + ts * 0.45); g.closePath(); g.stroke();
    g.textAlign = 'center'; g.font = `600 ${fs * 0.8}px system-ui,sans-serif`; g.fillText('1', tx, ty + ts * 0.12);
  }

  /* ---------- the koi ---------- */
  function cellOf(x, y) {
    const cx = Math.floor((x - bx) / bw * 8), cy = Math.floor((y - by) / bh * 6);
    return (cx >= 0 && cx < 8 && cy >= 0 && cy < 6) ? [cx, cy] : null;
  }
  function pickTarget() {
    if (Math.random() < 0.3) return {x: W * (0.08 + Math.random() * 0.84), y: H * (0.1 + Math.random() * 0.7)};
    let best = null, bestScore = Infinity;
    for (let k = 0; k < 10; k++) {
      const cx = Math.floor(Math.random() * 8), cy = Math.floor(Math.random() * 6);
      const x = bx + (cx + 0.5) / 8 * bw, y = by + (cy + 0.5) / 6 * bh;
      const d = Math.hypot(x - pts[0].x, y - pts[0].y);
      const score = grid[cy][cx] * 1000 + (d < L * 0.8 ? 500 : 0) + Math.random() * 50;
      if (score < bestScore) { bestScore = score; best = {x, y}; }
    }
    return best;
  }

  function step(dt, time) {
    if (!target || Math.hypot(target.x - pts[0].x, target.y - pts[0].y) < L * 0.45) target = pickTarget();
    let want = Math.atan2(target.y - pts[0].y, target.x - pts[0].x), diff = want - ang;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const turn = 2.0 * dt;
    ang += Math.max(-turn, Math.min(turn, diff)) + Math.sin(time * 6.5) * 0.6 * dt;
    const speed = L * (1.15 + 0.25 * Math.sin(time * 0.7));
    const prev = {x: pts[0].x, y: pts[0].y};
    pts[0].x += Math.cos(ang) * speed * dt; pts[0].y += Math.sin(ang) * speed * dt;
    for (let i = 1; i <= N; i++) {
      const a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      if (d > seg) { b.x = a.x + dx / d * seg; b.y = a.y + dy / d * seg; }
    }
    // reveal the plan under the fish's body
    const k = Math.floor(N * 0.3), src = pts[k], rr = L * 0.27;
    const cell = cellOf(src.x, src.y); if (cell) grid[cell[1]][cell[0]] += dt;
    rctx.save(); rctx.beginPath(); rctx.arc(src.x, src.y, rr, 0, 7); rctx.clip();
    rctx.drawImage(plan, 0, 0, W, H); rctx.restore();
    wake.push({x: pts[N >> 1].x, y: pts[N >> 1].y, t: time});
    while (wake.length && time - wake[0].t > 2.6) wake.shift();
    return prev;
  }

  function bodyGeom(time) {
    const P = [], left = [], right = [], dirs = [];
    for (let i = 0; i <= N; i++) {
      const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, N)];
      const d = Math.atan2(a.y - b.y, a.x - b.x); dirs.push(d);
      const u = i / N, nx = Math.cos(d + Math.PI / 2), ny = Math.sin(d + Math.PI / 2);
      const wv = Math.sin(time * 9 - i * 0.55) * L * 0.035 * Math.pow(u, 1.2);
      P.push({x: pts[i].x + nx * wv, y: pts[i].y + ny * wv, nx, ny});
    }
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const prof = u < 0.2 ? 0.55 + 0.45 * Math.sin(u / 0.2 * Math.PI / 2) : (1 - Math.pow((u - 0.2) / 0.8, 1.6)) * 0.9 + 0.1;
      const w = L * 0.115 * prof;
      left.push({x: P[i].x + P[i].nx * w, y: P[i].y + P[i].ny * w});
      right.push({x: P[i].x - P[i].nx * w, y: P[i].y - P[i].ny * w});
    }
    const tip = {x: P[0].x + Math.cos(dirs[0]) * L * 0.07, y: P[0].y + Math.sin(dirs[0]) * L * 0.07};
    return {P, left, right, dirs, tip};
  }
  function bodyPath(g, G, ox = 0, oy = 0) {
    const ring = [G.tip, ...G.left, ...G.right.slice().reverse()];
    g.beginPath();
    const m = (a, b) => ({x: (a.x + b.x) / 2 + ox, y: (a.y + b.y) / 2 + oy});
    let s = m(ring[ring.length - 1], ring[0]); g.moveTo(s.x, s.y);
    for (let i = 0; i < ring.length; i++) {
      const c = ring[i], n = ring[(i + 1) % ring.length], e = m(c, n);
      g.quadraticCurveTo(c.x + ox, c.y + oy, e.x, e.y);
    }
    g.closePath();
  }
  function fins(g, G, time, ox = 0, oy = 0) {
    const v = a => ({x: Math.cos(a), y: Math.sin(a)});
    // pectoral fins
    const i = 4, p = G.P[i], d = G.dirs[i], flap = Math.sin(time * 5) * 0.25;
    [1, -1].forEach(s => {
      const a = d + Math.PI - s * (0.95 + flap), w = L * 0.1;
      const cx = p.x + p.nx * s * L * 0.08 + v(a).x * L * 0.07, cy = p.y + p.ny * s * L * 0.08 + v(a).y * L * 0.07;
      g.beginPath(); g.ellipse(cx + ox, cy + oy, w, L * 0.038, a, 0, 7); g.fill();
    });
    // tail
    const T = G.P[N], back = G.dirs[N] + Math.PI, fl = Math.sin(time * 9 - N * 0.55) * 0.35;
    const at = (a, r) => ({x: T.x + v(a).x * r + ox, y: T.y + v(a).y * r + oy});
    const t1 = at(back - 0.5 + fl, L * 0.27), t2 = at(back + 0.5 + fl, L * 0.27), notch = at(back + fl, L * 0.13);
    const c1 = at(back - 0.22 + fl, L * 0.2), c2 = at(back + 0.22 + fl, L * 0.2);
    g.beginPath(); g.moveTo(T.x + ox, T.y + oy);
    g.quadraticCurveTo(c1.x, c1.y, t1.x, t1.y); g.quadraticCurveTo(notch.x, notch.y, notch.x, notch.y);
    g.quadraticCurveTo(notch.x, notch.y, t2.x, t2.y); g.quadraticCurveTo(c2.x, c2.y, T.x + ox, T.y + oy);
    g.fill();
    // dorsal ridge
    g.save(); g.globalAlpha *= 0.5; g.lineWidth = L * 0.025; g.lineCap = 'round'; g.beginPath();
    for (let k = 5; k <= 11; k++) { const q = G.P[k]; k === 5 ? g.moveTo(q.x + ox, q.y + oy) : g.lineTo(q.x + ox, q.y + oy); }
    g.stroke(); g.restore();
  }
  function drawKoi(time) {
    const G = bodyGeom(time), sx = L * 0.05, sy = L * 0.08;
    // shadow on the pond floor
    ctx.save(); ctx.fillStyle = 'rgba(70,0,0,0.28)'; ctx.strokeStyle = 'rgba(70,0,0,0.28)';
    bodyPath(ctx, G, sx, sy); ctx.fill(); fins(ctx, G, time, sx, sy); ctx.restore();
    // fins (translucent white)
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.82)'; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    fins(ctx, G, time); ctx.restore();
    // body
    ctx.save(); bodyPath(ctx, G); ctx.fillStyle = '#fffaf6'; ctx.fill(); ctx.clip();
    ctx.fillStyle = PATCH;
    [[1, 0.9, 0.25], [6, 1.25, -0.35], [10, 1.05, 0.4], [13, 0.8, -0.2]].forEach(([i, s, off]) => {
      const p = G.P[i], w = L * 0.115;
      ctx.beginPath(); ctx.ellipse(p.x + p.nx * w * off, p.y + p.ny * w * off, w * s, w * s * 0.85, G.dirs[i], 0, 7); ctx.fill();
    });
    ctx.restore();
    // eyes
    const h = G.P[1], d = G.dirs[1];
    ctx.fillStyle = EYE;
    [1, -1].forEach(s => { ctx.beginPath(); ctx.arc(h.x + h.nx * s * L * 0.065 + Math.cos(d) * L * 0.02, h.y + h.ny * s * L * 0.065 + Math.sin(d) * L * 0.02, L * 0.013, 0, 7); ctx.fill(); });
  }

  /* ---------- frame ---------- */
  function frame(ms) {
    const now = ms / 1000, dt = Math.min(0.05, now - (last || now)); last = now;
    let phase = now - cycleStart;
    if (phase > CYCLE) { resetCycle(now, false); phase = 0; }
    step(dt, now);

    // pond
    ctx.fillStyle = RED; ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.2, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(60,0,0,0.28)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // faint hint of the hidden sheet, then what the koi has revealed
    ctx.globalAlpha = 0.045; ctx.drawImage(plan, 0, 0, W, H);
    const fade = phase > CYCLE - FADE ? Math.max(0, (CYCLE - phase) / FADE) : 1;
    ctx.globalAlpha = fade; ctx.drawImage(rev, 0, 0, W, H); ctx.globalAlpha = 1;

    // white line wake
    ctx.lineCap = 'round'; ctx.lineWidth = 1.4;
    for (let i = 1; i < wake.length; i++) {
      const a = wake[i - 1], b = wake[i];
      ctx.strokeStyle = `rgba(255,255,255,${0.75 * (1 - (now - b.t) / 2.6)})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }

    drawKoi(now);

    // small sparkles
    sparkles.forEach(s => {
      const a = Math.max(0, Math.sin(now * s.sp + s.p)); if (a < 0.05) return;
      const r = s.s * a; ctx.fillStyle = s.c; ctx.globalAlpha = a * 0.9;
      ctx.beginPath(); ctx.moveTo(s.x, s.y - r); ctx.quadraticCurveTo(s.x, s.y, s.x + r, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + r); ctx.quadraticCurveTo(s.x, s.y, s.x - r, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - r); ctx.fill(); ctx.globalAlpha = 1;
    });

    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
